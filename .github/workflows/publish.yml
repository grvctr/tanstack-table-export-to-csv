name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - name: Verify tag matches package version
        run: node -e "const v=require('./package.json').version; if(process.env.GITHUB_REF_NAME !== 'v'+v) throw new Error('Expected tag v'+v)"
      - run: npm publish
